- name: Создать каталог для ключей
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Скачать GPG-ключ Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Добавить репозиторий Docker (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.asc
    enabled: yes
    state: present

- name: Установить пакеты Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Настроить daemon.json с зеркалами
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": [
          "https://dockerhub.timeweb.cloud",
          "https://mirror.gcr.io"
        ]
      }
    mode: '0644'
  notify: Перезапустить docker

- name: Добавить vlk в группу docker
  ansible.builtin.user:
    name: vlk
    groups: docker
    append: yes

- name: Docker запущен и включён в автозагрузку
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes