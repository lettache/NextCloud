- name: Каталог стека
  ansible.builtin.file:
    path: "{{ nc_dir }}"
    state: directory

- name: compose.yml
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ nc_dir }}/compose.yml"

- name: Каталог web для nginx.conf
  ansible.builtin.file:
    path: "{{ nc_dir }}/web"
    state: directory
    mode: '0755'

- name: nginx.conf
  ansible.builtin.copy:
    src: nginx.conf
    dest: "{{ nc_dir }}/web/nginx.conf"
    mode: '0644'

- name: .env из шаблона
  ansible.builtin.template:
    src: env.j2
    dest: "{{ nc_dir }}/.env"
    owner: vlk
    group: vlk
    mode: "0600"
  no_log: true

- name: docker compose up -d
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ nc_dir }}"
  register: compose_out
  changed_when: "'Created' in compose_out.stdout or 'Started' in compose_out.stdout"
  failed_when: compose_out.rc != 0

- name: Ждём Nextcloud
  ansible.builtin.uri:
    url: "http://localhost:{{ nc_port }}/status.php"
    return_content: yes
    status_code: 200
  register: nc_status
  until: nc_status.content is search('"installed":true')
  retries: 30
  delay: 10

- name: Включить files_external
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ app:enable files_external
    chdir: "{{ nc_dir }}"
  register: ext_app
  changed_when: "'already enabled' not in ext_app.stdout"

- name: Превью выключены
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ config:system:set enable_previews --type boolean --value false
    chdir: "{{ nc_dir }}"
  changed_when: true

- name: Настройка S3 хранилища
  ansible.builtin.command:
    chdir: "{{ nc_dir }}"
    cmd: >
      docker compose exec -T -u www-data app php occ files_external:create
      s3-media amazons3 amazons3::accesskey
      -c bucket={{ s3_bucket }}
      -c hostname={{ s3_endpoint }}
      -c region={{ s3_region }}
      -c storageClass=STANDARD
      -c use_path_style=true
      -c key={{ s3_access_key }}
      -c secret={{ s3_secret_key }}
  register: mount_out
  changed_when: mount_out.rc == 0
  failed_when:
    - mount_out.rc != 0
    - "'already exists' not in mount_out.stderr"
  no_log: true